
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bybit - Secure Smart Control</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #ffffff;
      color: #333;
    }
    header {
      background-color: #121212;
      color: #fff;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
      color: #f2a900;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 500;
    }
    .hero {
      background: #f2a900;
      padding: 80px 40px;
      text-align: center;
    }
    .hero h2 {
      font-size: 36px;
      margin: 0 0 10px;
    }
    .hero p {
      font-size: 18px;
      color: #222;
    }
    .section {
      padding: 60px 40px;
      max-width: 1200px;
      margin: auto;
    }
    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .feature {
      flex: 1;
      min-width: 260px;
      background: #f9f9f9;
      padding: 20px;
      border-radius: 10px;
    }
    .map {
      text-align: center;
    }
    iframe {
      width: 100%;
      max-width: 600px;
      height: 300px;
      border: none;
      border-radius: 10px;
    }
    footer {
      text-align: center;
      padding: 20px;
      background: #121212;
      color: #fff;
    }
    img.logo {
      height: 50px;
    }
  </style>
</head>
<body>

<header>
  <h1>Bybit</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">Features</a>
    <a href="#">Control</a>
    <a href="#">Contact</a>
  </nav>
</header>

<section class="hero">
  <img src="bitcoin.png" alt="Bitcoin Logo" class="logo">
  <h2>Smart Location Control. Secure. Fast. Professional.</h2>
  <p>Monitor and manage your smart devices with confidence and style — powered by Bybit technology.</p>
</section>

<section class="section">
  <h2>Features</h2>
  <div class="features">
    <div class="feature">
      <h3>Smart Control</h3>
      <p>Control lights, locks, AC, and more remotely using your secure dashboard.</p>
    </div>
    <div class="feature">
      <h3>Live Map</h3>
      <p>Track and display real-time location of your equipment using GPS integration.</p>
    </div>
    <div class="feature">
      <h3>Secure & Fast</h3>
      <p>Built with modern web standards, your system is protected and optimized for speed.</p>
    </div>
  </div>
</section>

<section class="section map">
  <h2>Location</h2>
  <iframe
    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2624.999058702215!2d2.294481315674049!3d48.85884407928762!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47e66fdebdfb9b71%3A0x8c0be8f9d4c48c3!2sEiffel%20Tower!5e0!3m2!1sen!2sfr!4v1614842480592!5m2!1sen!2sfr"
    allowfullscreen="" loading="lazy">
  </iframe>
</section>

<footer>
  &copy; 2025 Bybit Smart Systems. All rights reserved.
</footer>

